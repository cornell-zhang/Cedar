# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar-workflow"
version = "0.1.0"
description = "Cedar: agent-guided, proof-gated e-graph optimization of RTL with measured PPA feedback"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Cedar contributors" }]
dependencies = [
    "PyYAML>=6.0",
    "z3-solver>=4.12",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cedar = "cedar.cli:main"

[project.urls]
Source = "https://github.com/cornell-zhang/Cedar"

# Explicit inclusion lists: only the cedar package and its declared data files
# are packaged. Local profiles, run outputs and orchestration files can never
# enter the wheel/sdist through package discovery.
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["cedar", "cedar.*"]

[tool.setuptools.package-data]
cedar = [
    "data/prompts/*.md",
    "data/eda/*.tcl",
    "data/eda/*.v",
    "data/rules/*.egg",
    "data/examples/*",
    "data/schemas/*.json",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
